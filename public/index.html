<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- iOS 18.0.x standalone bug 绕开：必须 black，绝不用 black-translucent -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0a0a0f">
  <title>潜伏期 · 大厅</title>
  <!-- ★2026-09-05 08:17 她：「设计成开房和可以看到房间的吧，这样偶尔我还能和堂妹一起玩」
       大厅照麻将馆那张来：同一套主题地基 + 牌桌通用件（.lobby / .lb-* / .cd-room-card），
       只有一种游戏，所以没有「玩什么」那一排、没有筛选条（飞行棋/麻将馆大厅的先例）。 -->
  <script src="/assets-theme/boot.js?v=20260823000126"></script>
  <script src="/assets-theme/icons.js?v=20260823000126"></script>
  <link rel="stylesheet" href="/assets-theme/swp2.css?v=2">
  <link rel="stylesheet" href="/assets-theme/base.css?v=20260829c">
  <link rel="stylesheet" href="base-cards.css?v=20260905">
  <link rel="stylesheet" href="plague.css?v=20260905lobby">
</head>
<body>
  <div class="cn-aurora"></div>

  <div class="lobby">
    <div class="lb-head">
      <h1>潜伏期</h1>
      <p>一个放病，一个救人。开一间房，把邀请链接丢给对面</p>
    </div>

    <section class="cn-card lb-card">
      <div class="hd"><span class="ic" id="lb-ic-new"></span>开个新房间</div>

      <div class="cd-field-row">
        <span class="k">房间名</span>
        <input id="lb-room" maxlength="24" placeholder="比如「今晚谁也别想赢」">
      </div>
      <div class="cd-field-row">
        <span class="k">你的昵称</span>
        <input id="lb-name" maxlength="16" placeholder="怎么称呼你（进别人房也用这个名）">
      </div>
      <div class="cd-field-row">
        <span class="k">你当哪边</span>
        <div class="cd-games pg-sides" id="lb-sides">
          <button type="button" class="cd-gamepick is-on" data-side="plague"><span class="k">瘟疫</span><span class="n">挑一国投放，把病传遍世界</span></button>
          <button type="button" class="cd-gamepick" data-side="cure"><span class="k">人类</span><span class="n">封口岸、打疫苗、把解药做出来</span></button>
        </div>
      </div>

      <button class="cd-btn cd-btn--primary cd-btn--wide" id="lb-create">建房间并入座</button>
    </section>

    <section>
      <div class="lb-sec"><span class="cd-eyebrow">房间</span>
        <button class="cd-btn cd-btn--ghost cd-btn--sm" id="lb-refresh" aria-label="刷新"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8"/><path d="M20 3.5V8h-4.5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 16"/><path d="M4 20.5V16h4.5"/></svg></button>
      </div>
      <div class="lb-rooms" id="lb-rooms"><div class="cd-empty">加载中…</div></div>
    </section>
  </div>

  <script src="/plague/js/ui.js?v=20260905lobby"></script>
  <script src="/plague/js/lobby.js?v=202609212219name"></script>
  <script src="/assets-theme/swp2.js?v=2"></script>
</body>
</html>
